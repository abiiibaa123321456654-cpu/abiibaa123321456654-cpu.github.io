<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Загрузка...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #1a1a2e;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }
    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }
    p {
      font-size: 24px;
      color: #aaa;
    }
    .spinner {
      margin-top: 30px;
      width: 50px;
      height: 50px;
      border: 5px solid #333;
      border-top: 5px solid #e94560;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <h1>Добро пожаловать!</h1>
  <p>Сервер загружается, подождите...</p>
  <div class="spinner"></div>
</body>
</html>
