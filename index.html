<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Загрузка сервера GMod</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Arial', sans-serif;
      color: white;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
    }

    .slideshow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 2;
    }

    .content {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.9);
    }

    h1 {
      font-size: 50px;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    p {
      font-size: 22px;
      color: #ddd;
      margin-bottom: 25px;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 6px solid rgba(255, 255, 255, 0.2);
      border-top: 6px solid #e94560;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Точные пути к твоим 9 картинкам -->
  <div class="slideshow">
    <div class="slide active" style="background-image: url('1.jpg');"></div>
    <div class="slide" style="background-image: url('2.jpg');"></div>
    <div class="slide" style="background-image: url('3.jpg');"></div>
    <div class="slide" style="background-image: url('4.jpg');"></div>
    <div class="slide" style="background-image: url('5.jpg');"></div>
    <div class="slide" style="background-image: url('6.jpg');"></div>
    <div class="slide" style="background-image: url('7.jpg');"></div>
    <div class="slide" style="background-image: url('8.jpg');"></div>
    <div class="slide" style="background-image: url('9.png');"></div>
  </div>

  <div class="overlay"></div>

  <div class="content">
    <h1>ДОБРО ПОЖАЛОВАТЬ НА СЕРВЕР</h1>
    <p id="map-info">Загрузка ресурсов сервера...</p>
    <div class="spinner"></div>
  </div>

  <script>
    const slides = document.querySelectorAll('.slide');
    let currentSlide = 0;
    const slideInterval = 4000; // Менять картинку каждые 4 секунды

    function nextSlide() {
      slides[currentSlide].classList.remove('active');
      currentSlide = (currentSlide + 1) % slides.length;
      slides[currentSlide].classList.add('active');
    }

    setInterval(nextSlide, slideInterval);

    // Подтянуть название карты из GMod
    const params = new URLSearchParams(window.location.search);
    const mapName = params.get('map');
    if (mapName) {
      document.getElementById('map-info').textContent = 'Загружается карта: ' + mapName;
    }
  </script>
</body>
</html>
